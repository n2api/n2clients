name: Axios Client Tests

on:
  pull_request:
    paths:
    - 'clients/**'
    - '.github/workflows/axios-client.yml'


jobs:
  test-axios-client:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run axios client tests
      run: npm run testclient:typescript-axios

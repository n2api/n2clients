name: Axios Client Tests

on:
  pull_request:
    branches:
      - main


jobs:
  test-axios-client:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate TypeScript Axios client
      run: npm run genclient:typescript-axios

    - name: Run axios client tests
      run: npm run testclient:typescript-axios
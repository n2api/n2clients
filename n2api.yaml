              - RUNNING
              - PAUSED
              - UNKNOWN
        - name: platforms
          required: false
          in: query
          description: List of platforms to include in the response.
          schema:
            type: array
            items:
              type: string
              enum:
                - ActiveAgent
                - Facebook
                - GoogleAds
                - TheTradeDesk
                - Pinterest
        - name: customers
          required: false
          in: query
          description: List of Customer IDs whose Ads to include in the response.
          schema:
            type: array
            items:
              type: string
        - name: ids
          required: false
          in: query
          description: >-
            List of Ad IDs to include in the response. Requires platform and
            customer to be set to a single value.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ad'
      tags:
        - Ads
      security:
        - bearerAuth: []
  /reporting:
    get:
      operationId: ReportingController_getReport_ixk9wf
      parameters:
        - name: start
          required: false
          in: query
          description: >-
            Start date of the report. This is the "earlier" of the two dates.
            Example: set start to 2021-01-01 and end to 2021-01-31 to get a
            report for the month of January 2021.
          schema:
            type: string
        - name: end
          required: false
          in: query
          description: >-
            End date of the report. This is the "later" of the two dates.
            Example: set start to 2021-01-01 and end to 2021-01-31 to get a
            report for the month of January 2021.
          schema:
            type: string
        - name: granularity
          required: true
          in: query
          schema:
            type: string
        - name: dimensions
          required: true
          in: query
          schema:
            type: string
        - name: fields
          required: true
          in: query
          schema:
            type: string
        - name: filters
          required: false
          in: query
          schema:
            type: string
        - name: callCounter
          required: false
          in: query
          schema:
            type: boolean
        - name: platform
          required: true
          in: query
          schema:
            type: string
            enum:
              - ActiveAgent
              - Facebook
              - GoogleAds
              - TheTradeDesk
              - Pinterest
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      tags:
        - Reporting
      security:
        - bearerAuth: []
info:
  title: n2api
  description: >-
    This is the official API reference for the n_2 API. See docs.n2api.io for
    more information.
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: https://api.n2api.io
    description: Production server
  - url: http://localhost:5001
    description: Local server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: The email of the user.
          example: user@example.com
        password:
          type: string
          description: The password of the user.
          example: password123
      required:
        - email
        - password
    SessionTokenDto:
      type: object
      properties:
        customerId:
          type: string
          description: The UUID of the customer.
          example: abcdef01-2345-6789-abcd-ef0123456789
      required:
        - customerId
    SessionTokenVerifyDto:
      type: object
      properties:
        sessionToken:
          type: string
          description: The session token to be verified.
          example: eyxxxxx.xxxxxx.xxxxxx
      required:
        - sessionToken
    ZipcodeDto:
      type: object
      properties:
        countryCode:
          type: string
        value:
          type: string
      required:
        - countryCode
        - value
    ZipcodeGeoTargetingDto:
      type: object
      properties:
        targetingKind:
          default: PostalCodeGeoTargeting
          enum:
            - PostalCodeGeoTargeting
            - CountryTargeting
            - UserFrequencyCapping
            - SocioDemographicTargeting
            - InterestsTargeting
            - SearchTermTargeting
            - UrlTargeting
            - UnknownTargeting
          type: string
        zipcodes:
          type: array
          items:
            $ref: '#/components/schemas/ZipcodeDto'
      required:
        - targetingKind
        - zipcodes
    FrequencyCappingDto:
      type: object
      properties:
        targetingKind:
          default: UserFrequencyCapping
          enum:
            - PostalCodeGeoTargeting
            - CountryTargeting
            - UserFrequencyCapping
            - SocioDemographicTargeting
            - InterestsTargeting
            - SearchTermTargeting
            - UrlTargeting
            - UnknownTargeting
          type: string
        time:
          type: number
        requests:
          type: number
      required:
        - targetingKind
        - time
        - requests
    CreateAdDto:
      type: object
      properties: {}
    CreateAdSetDto:
      type: object
      properties:
        targetings:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/ZipcodeGeoTargetingDto'
              - $ref: '#/components/schemas/FrequencyCappingDto'
        settings:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/MaximumCPMDto'
              - $ref: '#/components/schemas/RealtimeBiddingStrategyDto'
              - $ref: '#/components/schemas/PacingDto'
              - $ref: '#/components/schemas/DailyBudgetDto'
              - $ref: '#/components/schemas/MaximumDailyImpressionsDto'
              - $ref: '#/components/schemas/KPIOptimizationDto'
        channelKind:
          enum:
            - UNKNOWN
            - MIXED
            - DOOH
            - SEARCH
            - SOCIAL
            - WEB_BANNER
            - WEB_VIDEO
            - AUDIO
          type: string
        name:
          type: string
        ads:
          type: array
          items:
            $ref: '#/components/schemas/CreateAdDto'
      required:
        - channelKind
        - name
    CreateCampaignDto:
      type: object
      properties: {}
    RuntimeBudget:
      type: object
      properties:
        startTime:
          type: string
        endTime:
          type: string
        budget:
          type: number
        clicks:
          type: number
        impressions:
          type: number
      required:
        - startTime
        - endTime
        - budget
        - clicks
        - impressions
    ActiveAgentOrderDto:
      type: object
      properties:
        id:
          type: number
        advertiserId:
          type: number
        networkId:
          type: number
        campaignIds:
          type: array
          items:
            type: number
        name:
          type: string
        runtimeBudgets:
          default: []
          type: array
          items:
            $ref: '#/components/schemas/RuntimeBudget'
        lastUpdate:
          type: number
        deleted:
          type: boolean
        advertiserMarginId:
          type: number
        agencyId:
          type: number
        calculatedDailyBudget:
          type: number
        calculatedDailyImpressions:
          type: number
        dailyBudget:
          type: number
        dailyClicks:
          type: number
        dailyImpressions:
          type: number
        dailyPacing:
          type: boolean
        footfallStoreConfigId:
          type: number
        pace:
          type: number
        runtimePacing:
          type: boolean
        runtimePacingFactor:
          type: number
        totalBudget:
          type: number
        totalClicks:
          type: number
        totalImpressions:
          type: number
      required:
        - id
        - advertiserId
        - networkId
        - campaignIds
        - name
        - runtimeBudgets
        - lastUpdate
        - deleted
    Setting:
      type: object
      properties: {}
    Ad:
      type: object
      properties:
        platform:
          enum:
            - ActiveAgent
            - Facebook
            - GoogleAds
            - TheTradeDesk
            - Pinterest
          type: string
        name:
          type: string
        id:
          type: string
        adAccount:
          type: string
        channelKind:
          type: string
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
        targetings:
          type: array
          items:
            type: object
        kind:
          type: string
        status:
          enum:
            - ACTIVE
            - RUNNING
            - PAUSED
            - UNKNOWN
          type: string
      required:
        - platform
        - name
        - id
        - adAccount
        - channelKind
        - settings
        - kind
        - status
    AdSet:
      type: object
      properties:
        platform:
          enum:
            - ActiveAgent
            - Facebook
            - GoogleAds
            - TheTradeDesk
            - Pinterest
          type: string
        name:
          type: string
        id:
          type: string
        adAccount:
          type: string
        parentId:
          type: string
        channelKind:
          type: string
        settings:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
        targetings:
          type: array
          items:
            type: object
        ads:
          type: array
          items:
            $ref: '#/components/schemas/Ad'
        kind:
          type: string
        status:
          enum:
            - ACTIVE
            - RUNNING
            - PAUSED
            - UNKNOWN
          type: string
      required:
        - platform
        - name
        - id
        - adAccount
        - parentId
        - channelKind
        - settings
        - kind
        - status
    Campaign:
      type: object
      properties:
        platform:
          enum:
            - ActiveAgent
            - Facebook
            - GoogleAds
            - TheTradeDesk
            - Pinterest
          type: string
        id:
          type: string
        adAccount:
          type: string
        channelKind:
          type: string
        name:
          type: string
        advertiser:
          type: string
        lastUpdate:
          type: number
        status:
          enum:
            - ACTIVE
            - RUNNING
            - PAUSED
            - UNKNOWN
          type: string
        adSets:
          type: array
          items:
            $ref: '#/components/schemas/AdSet'
        settings:
          type: array
          items:
            type: object
        targetings:
          type: array
          items:
            type: object
        kind:
          type: string
      required:
        - platform
        - id
        - adAccount
        - channelKind
        - name
        - advertiser
        - lastUpdate
        - status
        - settings
        - kind
    UpdateCampaignDto:
      type: object
      properties: {}
    Report:
      type: object
      properties: {}
    UrlTargetingDto:
      type: object
      properties:
        targetingKind:
          default: UrlTargeting
          enum:
            - PostalCodeGeoTargeting
            - CountryTargeting
            - UserFrequencyCapping
            - SocioDemographicTargeting
            - InterestsTargeting
            - SearchTermTargeting
            - UrlTargeting
            - UnknownTargeting
          type: string
        urls:
          type: array
          items:
            type: string
      required:
        - targetingKind
        - urls
    CreateTargetingDto:
      type: object
      properties:
        targetings:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/ZipcodeGeoTargetingDto'
              - $ref: '#/components/schemas/FrequencyCappingDto'
              - $ref: '#/components/schemas/UrlTargetingDto'
      required:
        - targetings
    CreateAdsetDto:
      type: object
      properties: {}
    ActiveAgentAdSetAdapter:
      type: object
      properties: {}
    UpdateAdsetDto:
      type: object
      properties: {}
    ActiveAgentCreateCredentialDto:
      type: object
      properties:
        username:
          type: string
          description: The username of the credential.
          example: foo@bar.com
        password:
          type: string
          description: The password of the credential.
          example: password123
      required:
        - username
        - password
    RedirectUriDTO:
      type: object
      properties:
        redirect_uri:
          type: string
          description: The redirect URI for the company.
          example: https://example.com
      required:
        - redirect_uri
    MaximumCPMDto:
      type: object
      properties:
        settingType:
          type: string
          default: MaximumCPM
          enum:
            - DailyBudget
            - TotalBudget
            - Unknown
            - Runtime
            - MaximumCPM
            - MaximumDailyImpressions
            - MaximumLifetimeImpressions
            - MediaSize
            - Pacing
            - RealtimeBiddingStrategy
            - KPIOptimization
            - BidCapping
        maximumCpm:
          type: number
      required:
        - settingType
        - maximumCpm
    RealtimeBiddingStrategyDto:
      type: object
      properties:
        settingType:
          type: string
          default: RealtimeBiddingStrategy
          enum:
            - DailyBudget
            - TotalBudget
            - Unknown
            - Runtime
            - MaximumCPM
            - MaximumDailyImpressions
            - MaximumLifetimeImpressions
            - MediaSize
            - Pacing
            - RealtimeBiddingStrategy
            - KPIOptimization
            - BidCapping
        realtimeBiddingStrategy:
          type: string
          enum:
            - Maxprice
            - Floorprice
            - IntervalBudgetOptimized
            - LowestCostUncapped
            - LowestCostCapped
            - CostCapped
            - Unknown
      required:
        - settingType
        - realtimeBiddingStrategy
    PacingDto:
      type: object
      properties:
        settingType:
          type: string
          default: Pacing
          enum:
            - DailyBudget
            - TotalBudget
            - Unknown
            - Runtime
            - MaximumCPM
            - MaximumDailyImpressions
            - MaximumLifetimeImpressions
            - MediaSize
            - Pacing
            - RealtimeBiddingStrategy
            - KPIOptimization
            - BidCapping
        pacingType:
          type: string
          enum:
            - 'Off'
            - EvenlyOverDay
            - EvenlyOverRuntime
            - Ahead
            - DayParting
            - Unknown
      required:
        - settingType
        - pacingType
    DailyBudgetDto:
      type: object
      properties:
        settingType:
          type: string
          default: DailyBudget
          enum:
            - DailyBudget
            - TotalBudget
            - Unknown
            - Runtime
            - MaximumCPM
            - MaximumDailyImpressions
            - MaximumLifetimeImpressions
            - MediaSize
            - Pacing
            - RealtimeBiddingStrategy
            - KPIOptimization
            - BidCapping
        dailyBudget:
          type: number
      required:
        - settingType
        - dailyBudget
    MaximumDailyImpressionsDto:
      type: object
      properties:
        settingType:
          type: string
          default: MaximumDailyImpressions
          enum:
            - DailyBudget
            - TotalBudget
            - Unknown
            - Runtime
            - MaximumCPM
            - MaximumDailyImpressions
            - MaximumLifetimeImpressions
            - MediaSize
            - Pacing
            - RealtimeBiddingStrategy
            - KPIOptimization
            - BidCapping
        maximumDailyImpressions:
          type: number
      required:
        - settingType
        - maximumDailyImpressions
    CreateSettingDto:
      type: object
      properties:
        settings:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/MaximumCPMDto'
              - $ref: '#/components/schemas/RealtimeBiddingStrategyDto'
              - $ref: '#/components/schemas/PacingDto'
              - $ref: '#/components/schemas/DailyBudgetDto'
              - $ref: '#/components/schemas/MaximumDailyImpressionsDto'
      required:
        - settings
    CustomerConnectUrlDTO:
      type: object
      properties: {}
    CreateCustomerDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the customer.
          example: John Doe
      required:
        - name
    CreatePinterestAuthDto:
      type: object
      properties:
        code:
          type: string
          description: The Pinterest auth code returned from the redirect.
          example: authCode123
        redirect_uri:
          type: string
          description: The Pinterest redirect uri.
          example: https://example.com/auth/pinterest/callback
      required:
        - code
        - redirect_uri
    PinterestCreateCredentialDto:
      type: object
      properties:
        access_token:
          type: string
          description: The access token of the credential.
          example: accessToken123
        refresh_token:
          type: string
          description: The refresh token of the credential.
          example: refreshToken123
        response_type:
          type: string
          description: The response type of the credential.
          example: bearer
        token_type:
          type: string
          description: The token type of the credential.
          example: bearer
        expires_in:
          type: number
          description: The expiration time of the access token.
          example: 3600
        refresh_token_expires_in:
          type: number
          description: The expiration time of the refresh token.
          example: 7200
        refresh_token_expires_at:
          type: number
          description: The expiration timestamp of the refresh token.
          example: 1680000000
        scope:
          type: string
          description: The scope of the credential.
          example: read_write
      required:
        - access_token
        - refresh_token
        - response_type
        - token_type
        - expires_in
        - refresh_token_expires_in
        - refresh_token_expires_at
        - scope
    GoogleAdsCreateCredentialDto:
      type: object
      properties:
        accessToken:
          type: string
          description: The access token of the credential.
          example: accessToken123
        refreshToken:
          type: string
          description: The refresh token of the credential.
          example: refreshToken123
        expires_in:
          type: number
          description: The number in seconds until the access token expires.
          example: 3600
      required:
        - accessToken
        - refreshToken
        - expires_in
    UpdateAdDto:
      type: object
      properties: {}
    CreateGoogleAdsAuthDto:
      type: object
      properties:
        code:
          type: string
          description: The Google auth code returned from the redirect.
          example: authCode123
        redirect_uri:
          type: string
          description: The Google redirect uri.
          example: https://example.com/auth/google/callback
      required:
        - code
        - redirect_uri
    GoogleAdsAdAccountWrapper:
      type: object
      properties:

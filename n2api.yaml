          description: The Facebook auth code returned from the redirect.
          example: authCode123
        redirect_uri:
          type: string
          description: The Facebook redirect uri.
          example: https://example.com/auth/facebook/callback
      required:
        - code
        - redirect_uri
    FacebookCreateCredentialDto:
      type: object
      properties:
        accessToken:
          type: string
          description: The accessToken of the credential.
          example: accessToken123
      required:
        - accessToken
    FacebookAdAccountWrapper:
      type: object
      properties:
        customer:
          type: string
      required:
        - customer
    TheTradeDeskCreateCredentialsDto:
      type: object
      properties:
        login:
          type: string
          description: The login for the credentials
          example: user@example.com
        password:
          type: string
          description: The password for the credentials
          example: password123
      required:
        - login
        - password
